name: Security Reviewer

# The pull_request path filter was removed with #542: `security` is required by
# ruleset 16189198, and a required check behind a path filter never reports on a
# PR outside those paths, so the PR can never merge. The push filter goes with
# it — a security scan that skips itself on some pushes to `main` leaves `main`
# unscanned for exactly the changes nobody classified as security-relevant, and
# #547 already demonstrated the shape (a CLI pin changed here and this workflow
# did not run). This retires the #549 self-listing workaround on both triggers.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

# Pin the harness CLI to a major (#318 A) — see AGENTS.md "Harness dependency surface".
env:
  HARNESS_CLI: '@harness-engineering/cli@11'

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Validate architecture
        run: npx --yes -p "$HARNESS_CLI" harness validate

      - name: Check dependencies
        run: npx --yes -p "$HARNESS_CLI" harness check-deps

      - name: Run security scan
        run: |
          npx --yes -p "$HARNESS_CLI" harness check-security \
            --severity error

      - name: Refresh security ledger
        run: node scripts/security_ledger.mjs

      # The bot cannot push to `main`: ruleset 16189198 carries a
      # `pull_request` rule with `bypass_actors: []`, so every direct push is
      # rejected with GH013. This step used to do exactly that and swallow the
      # rejection with `|| echo`, so 8/8 recent runs reported success while
      # committing nothing (#548). The ledger lands on a standing branch
      # instead, force-updated each run, so a push failure is a real failure.
      #
      # The PR is NOT opened here: this repo has
      # `can_approve_pull_request_reviews: false`, so `gh pr create` from a
      # workflow is refused outright (run 30976556644). Opening the PR is a
      # human step; the step summary below carries the compare link.
      - name: Push the security-ledger branch (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BRANCH: chore/security-ledger
        run: |
          if git diff --quiet -- .harness/security/timeline.json \
                                 docs/SECURITY_LEDGER.md; then
            echo "Security ledger unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add .harness/security/timeline.json docs/SECURITY_LEDGER.md
          git commit -m "chore: refresh security ledger after scan"
          git push --force origin "HEAD:$BRANCH"
          {
            echo "### Security ledger refreshed"
            echo
            echo "Pushed to \`$BRANCH\`. Open a PR to land it:"
            echo
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
