name: Security Reviewer

on:
  pull_request:
    paths:
      - 'ts/**'
      - 'npm/**'
      - 'agents/skills/**'
      - 'scripts/**'
  push:
    branches:
      - main
    paths:
      - 'ts/**'
      - 'npm/**'
      - 'agents/skills/**'
      - 'scripts/**'

permissions:
  contents: write

# Pin the harness CLI to a major (#318 A) — see AGENTS.md "Harness dependency surface".
env:
  HARNESS_CLI: '@harness-engineering/cli@10'

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Validate architecture
        run: npx --yes -p "$HARNESS_CLI" harness validate

      - name: Check dependencies
        run: npx --yes -p "$HARNESS_CLI" harness check-deps

      - name: Run security scan
        run: |
          npx --yes -p "$HARNESS_CLI" harness check-security \
            --severity error

      - name: Refresh security ledger
        run: node scripts/security_ledger.mjs

      - name: Commit ledger if changed (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --exit-code -- \
              .harness/security/timeline.json \
              docs/SECURITY_LEDGER.md; then
            git config user.name "github-actions[bot]"
            git config user.email \
              "github-actions[bot]@users.noreply.github.com"
            git add .harness/security/timeline.json \
                    docs/SECURITY_LEDGER.md
            git commit -m "chore: refresh security ledger after scan"
            git push origin HEAD:main || \
              echo "Push skipped — branch protection on main prevents direct push. Ledger drift will be picked up next run."
          fi
