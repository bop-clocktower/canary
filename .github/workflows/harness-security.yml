name: Security Reviewer

# The pull_request path filter was removed with #542: `security` is required by
# ruleset 16189198, and a required check behind a path filter never reports on a
# PR outside those paths, so the PR can never merge. The push filter goes with
# it — a security scan that skips itself on some pushes to `main` leaves `main`
# unscanned for exactly the changes nobody classified as security-relevant, and
# #547 already demonstrated the shape (a CLI pin changed here and this workflow
# did not run). This retires the #549 self-listing workaround on both triggers.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

# Pin the harness CLI to a major (#318 A) — see AGENTS.md "Harness dependency surface".
env:
  HARNESS_CLI: '@harness-engineering/cli@13'

jobs:
  security:
    runs-on: ubuntu-latest
    # #1427: the ledger step below force-pushes `chore/security-ledger`, so two
    # overlapping push-to-main runs used to race and the last writer silently
    # overwrote the other's ledger. Push-to-main runs now share one group keyed
    # on the ledger branch and queue (cancel-in-progress: false, so a running
    # ledger write is never killed). Every other run gets a group of its own
    # (run_id), so PR runs of the required `security` check never queue
    # behind main or behind each other. GitHub keeps one pending run per
    # group: a third overlapping main run supersedes the queued one, which is
    # fine here because the newest run regenerates the ledger from newer main.
    # `ts/test/workflow-hygiene.test.ts` fails on a force push with no group.
    concurrency:
      group: >-
        ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        'ledger-chore/security-ledger' || format('security-{0}', github.run_id)
        }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # #1401: run on the Node the repo pins. On Node 20 the CLI install
      # warned EBADENGINE (a dependency declares node >=22.19.0), and run
      # 39298544259 failed `harness validate` with exit 1 and no output.
      # That failure was never reproduced; this removes one variable from it.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # #1401, copying #1248 in harness-quality.yml: resolve the floating major
      # ONCE, then every scan below runs `"$HARNESS_CLI_EXACT"`. Before this,
      # each step re-ran `npx -p "$HARNESS_CLI"`, so one job resolved `@13`
      # three times and the log never said which version ran. The float stays
      # at the workflow level on purpose: CI tracks upstream, just not mid-run.
      # `ts/test/harness-cli-exact-pin.test.ts` fails on a scan that floats.
      - name: Resolve harness CLI version
        id: harness-cli
        run: |
          resolved="$(npx --yes -p "$HARNESS_CLI" harness --version 2>/dev/null \
            | tail -n 1 | tr -d '[:space:]')"
          if ! printf '%s' "$resolved" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "Could not resolve a version from '$HARNESS_CLI' (got '$resolved')." >&2
            exit 1
          fi
          echo "Resolved $HARNESS_CLI to $resolved"
          echo "HARNESS_CLI_EXACT=${HARNESS_CLI%@*}@$resolved" >> "$GITHUB_ENV"

      # #1401: a red validate must explain itself. `--json` gives a result to
      # print. On failure the log gets the exit code, the CLI version and the
      # result, or a line saying the result was empty. An empty result means
      # the CLI died before it reported, which is not an architecture
      # violation. The exit code is kept, so the gate stays red.
      # `ts/test/harness-security-workflow.test.ts` runs this script under a
      # stub npx. The result is also uploaded below (#588): the log copy is
      # for reading, the artifact is the record.
      - name: Validate architecture
        run: |
          rc=0
          npx --yes -p "$HARNESS_CLI_EXACT" harness validate --json \
            > harness-validate.json || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "harness validate passed ($HARNESS_CLI_EXACT)"
            exit 0
          fi
          echo "::error title=harness validate failed::harness validate exited $rc ($HARNESS_CLI_EXACT, node $(node --version 2>/dev/null || echo unknown))"
          if [ -s harness-validate.json ]; then
            echo "harness validate result:"
            cat harness-validate.json
            echo
          else
            echo "harness validate wrote no JSON result: the CLI exited before reporting (install or runtime failure, not a validation finding). See npm output above."
          fi
          exit "$rc"

      - name: Upload harness validate result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: harness-validate
          path: harness-validate.json
          if-no-files-found: warn

      - name: Check dependencies
        run: npx --yes -p "$HARNESS_CLI_EXACT" harness check-deps

      - name: Run security scan
        run: |
          npx --yes -p "$HARNESS_CLI_EXACT" harness check-security \
            --severity error

      - name: Refresh security ledger
        run: node scripts/security_ledger.mjs

      # The bot cannot push to `main`: ruleset 16189198 carries a
      # `pull_request` rule with `bypass_actors: []`, so every direct push is
      # rejected with GH013. This step used to do exactly that and swallow the
      # rejection with `|| echo`, so 8/8 recent runs reported success while
      # committing nothing (#548). The ledger lands on a standing branch
      # instead, force-updated each run, so a push failure is a real failure.
      #
      # The PR is NOT opened here: this repo has
      # `can_approve_pull_request_reviews: false`, so `gh pr create` from a
      # workflow is refused outright (run 30976556644). Opening the PR is a
      # human step; the step summary below carries the compare link.
      - name: Push the security-ledger branch (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BRANCH: chore/security-ledger
        run: |
          if git diff --quiet -- .harness/security/timeline.json \
                                 docs/SECURITY_LEDGER.md; then
            echo "Security ledger unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add .harness/security/timeline.json docs/SECURITY_LEDGER.md
          git commit -m "chore: refresh security ledger after scan"
          git push --force origin "HEAD:$BRANCH"
          {
            echo "### Security ledger refreshed"
            echo
            echo "Pushed to \`$BRANCH\`. Open a PR to land it:"
            echo
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
