name: Security Reviewer

on:
  pull_request:
    paths:
      - 'ts/**'
      - 'npm/**'
      - 'agents/skills/**'
      - 'scripts/**'
      # Self-test: a path-filtered workflow that omits its own file is the one
      # file in the repo it cannot gate (#549). #547 changed the CLI pin here
      # and this workflow did not run on that PR.
      - '.github/workflows/harness-security.yml'
  push:
    branches:
      - main
    paths:
      - 'ts/**'
      - 'npm/**'
      - 'agents/skills/**'
      - 'scripts/**'
      - '.github/workflows/harness-security.yml'

permissions:
  contents: write
  pull-requests: write

# Pin the harness CLI to a major (#318 A) — see AGENTS.md "Harness dependency surface".
env:
  HARNESS_CLI: '@harness-engineering/cli@10'

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Validate architecture
        run: npx --yes -p "$HARNESS_CLI" harness validate

      - name: Check dependencies
        run: npx --yes -p "$HARNESS_CLI" harness check-deps

      - name: Run security scan
        run: |
          npx --yes -p "$HARNESS_CLI" harness check-security \
            --severity error

      - name: Refresh security ledger
        run: node scripts/security_ledger.mjs

      # The bot cannot push to `main`: ruleset 16189198 carries a
      # `pull_request` rule with `bypass_actors: []`, so every direct push is
      # rejected with GH013. This step used to do exactly that and swallow the
      # rejection with `|| echo`, so 8/8 recent runs reported success while
      # committing nothing (#548). The ledger lands as a rolling upsert PR
      # instead — one standing branch, force-updated each run, so a push failure
      # is a real failure again.
      - name: Open or update the security-ledger PR (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/security-ledger
        run: |
          if git diff --quiet -- .harness/security/timeline.json \
                                 docs/SECURITY_LEDGER.md; then
            echo "Security ledger unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add .harness/security/timeline.json docs/SECURITY_LEDGER.md
          git commit -m "chore: refresh security ledger after scan"
          git push --force origin "HEAD:$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open \
                       --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore: refresh security ledger" \
              --body "Automated security-ledger refresh from \`harness-security.yml\`. This branch is force-updated on each qualifying push to \`main\`; merge whenever convenient. See #548 for why this is a PR rather than a direct push."
          fi
