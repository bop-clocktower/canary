name: Validate Plugin Manifest

on:
  push:
    branches: [main]
    paths:
      - '.claude-plugin/plugin.json'
      - '.claude-plugin/schemas/plugin.schema.json'
      - '.github/workflows/validate-plugin.yml'
  pull_request:
    branches: [main]
    paths:
      - '.claude-plugin/plugin.json'
      - '.claude-plugin/schemas/plugin.schema.json'
      - '.github/workflows/validate-plugin.yml'

jobs:
  validate:
    name: Validate plugin.json against schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate plugin manifest (ajv, draft-07)
        # ajv-cli (ajv v8) validates the draft-07 schema natively; no Python.
        run: |
          npx --yes ajv-cli@5 validate \
            -s .claude-plugin/schemas/plugin.schema.json \
            -d .claude-plugin/plugin.json
