name: Validate Plugin Manifest

# The pull_request path filter was removed with #542: this check is required by
# ruleset 16189198, and a required check behind a path filter never reports on a
# PR outside those paths, so the PR can never merge. Validating one JSON file
# against one schema is a few seconds, so there is nothing to save by skipping.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate plugin.json against schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Validate plugin manifest (ajv, draft-07)
        # ajv-cli (ajv v8) validates the draft-07 schema natively; no Python.
        run: |
          npx --yes ajv-cli@5 validate \
            -s .claude-plugin/schemas/plugin.schema.json \
            -d .claude-plugin/plugin.json
