name: PR Guardian
on:
  pull_request:
permissions:
  contents: read
  actions: read # #930: download main's lcov artifact for the merge base
  pull-requests: write # commenting; fork PRs get read-only → poster degrades
concurrency:
  group: guardian-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          # Node 22+ required by the bundled engine deps (see harness-quality.yml).
          node-version-file: .nvmrc
      - name: Build the TypeScript engine
        run: |
          npm --prefix ts ci
          npm --prefix ts run build
      # OPTIONAL (commented): lift fidelity to graph-verified where harness is present.
      #   Baseline is heuristic on stock CI (graph.json is gitignored). See plan Assumptions.
      # - run: npx --yes -p @harness-engineering/cli harness graph
      #
      # Coverage-verified tier (#655). This job passed no `--coverage` at all
      # until that issue, so every verdict canary posted on its own PRs came
      # from the heuristic (filename) tier — 17 of the last 17 guardian comments
      # read "coverage was unavailable", and the job finished in ~19s because it
      # never measured anything. The top rung of the fidelity ladder was
      # therefore unexecuted in this repo's CI, which is why #655 — a defect in
      # the coverage-verified scorer itself — could only be found downstream by
      # a consumer. Dogfooding the tier is what makes a regression in it visible
      # here rather than in someone else's repo.
      #
      # A test failure fails this job. That double-reports with harness-quality,
      # which is the honest trade: a verdict derived from a run that did not
      # complete is not a verdict.
      - name: Produce a coverage report for the guardian
        run: npm --prefix ts test
      # An absent or empty lcov makes pr-check degrade to the heuristic tier and
      # still exit 0 — indistinguishable from the wiring above having worked.
      # Say so instead of inheriting a green (#508).
      - name: Verify the coverage report exists
        run: |
          if [ ! -s ts/coverage/lcov.info ]; then
            echo "::error title=Coverage report missing::ts/coverage/lcov.info is absent or empty. The guardian would silently fall back to the heuristic tier and still report success."
            exit 1
          fi
      # Fetch the base branch so pr-check's own base-ref resolution can find it.
      # `fetch-depth: 0` above already gives full history; this makes sure the
      # `origin/<base>` ref exists, which is the first candidate pr-check tries.
      - name: Fetch the base branch
        env:
          BASE: ${{ github.base_ref }}
        run: git fetch --no-tags origin "$BASE"
      # Base coverage for the coverage-delta tier (#881, #930). Without it
      # every comment read `head-only` (24 of 24): a coverage REGRESSION was
      # undetectable. The report is main's own lcov, uploaded by `TS engine
      # (pilot)` in harness-quality.yml on each push as
      # `ts-coverage-lcov-<sha>`. Downloading it costs seconds; measuring the
      # base in-job would roughly double this job's test time (#760/#820).
      #
      # Staleness: the artifact is looked up by THIS PR's merge-base SHA — the
      # same base pr-check diffs against — and accepted only if the run that
      # produced it was a `$BASE` push built from exactly that SHA. The latest
      # main run is never substituted. No match (expired, run still pending,
      # cancelled, fork token without access) leaves BASE_COVERAGE empty and
      # pr-check posts its loud head-only notice. That is an abstention, not a
      # failure and not a pass; each exit below says which case it was.
      - name: Resolve base coverage for the merge base
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.base_ref }}
          REPO: ${{ github.repository }}
        run: |
          BASE_SHA=$(git merge-base "origin/$BASE" HEAD)
          head_only() {
            echo "::notice title=Coverage delta head-only::no base lcov for merge base ${BASE_SHA}: $1"
            exit 0
          }
          if ! listing=$(gh api "repos/$REPO/actions/artifacts?name=ts-coverage-lcov-${BASE_SHA}&per_page=100"); then
            head_only "artifact lookup failed"
          fi
          id=$(printf '%s' "$listing" | jq -r --arg sha "$BASE_SHA" --arg br "$BASE" \
            '[.artifacts[] | select(.expired == false and .workflow_run.head_sha == $sha and .workflow_run.head_branch == $br)][0].id // empty')
          if [ -z "$id" ]; then
            head_only "no unexpired artifact from a $BASE run at that SHA"
          fi
          if ! gh api "repos/$REPO/actions/artifacts/$id/zip" > "$RUNNER_TEMP/base-lcov.zip"; then
            head_only "artifact $id download failed"
          fi
          unzip -o -q "$RUNNER_TEMP/base-lcov.zip" -d "$RUNNER_TEMP/base-lcov"
          if [ ! -s "$RUNNER_TEMP/base-lcov/lcov.info" ]; then
            head_only "artifact $id holds no lcov.info"
          fi
          echo "Base coverage: artifact $id at ${BASE_SHA}"
          echo "path=$RUNNER_TEMP/base-lcov/lcov.info" >> "$GITHUB_OUTPUT"
      - name: Guardian pr-check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_COVERAGE: ${{ steps.base.outputs.path }}
        # `--emit-analysis` writes the finding record to the .harness/analyses/
        # channel (the #899 harness reverse-handoff producer); `--post-comment`
        # keeps findings visible while the harness consumer (#899) is pending —
        # once harness surfaces the record in `pre-merge-brief`, drop
        # `--post-comment`. On an unavailable channel the emit degrades LOUDLY
        # and falls back to the sticky comment (SC-10) — never a silent drop.
        #
        # `--diff` is deliberately OMITTED so this dogfood exercises the same
        # code path a consumer takes. It used to pass `--diff pr.diff`, which is
        # why #369 escaped: the bug was in the base-ref resolution that runs when
        # `--diff` is absent, so canary's own guardian could never have caught
        # it. It silently no-op'd on ~5 downstream PRs while this job stayed
        # green, because we exercised a privileged path our users do not.
        #
        # Exit-code handling (#508 Wave 5, ADR 0009). Exit 3 means ABSTAINED:
        # the guardian verified nothing. It has two causes, and the annotation
        # names neither because only the CLI's own output can say which — the
        # diff scoped zero findings-eligible units (a docs-only or fully-skipped
        # PR), or it resolved no coverage at all and every finding it produced
        # is a filename-level guess (#761). Neither is a failure; neither is a
        # pass, so the job annotates loudly instead of exiting green in silence.
        # Every other non-zero code propagates unchanged: 1 is a real finding
        # and must stay red. Treating "non-zero" as one bucket is what this
        # doctrine exists to end, so the template that consumes the code has to
        # make the same distinction the CLI does.
        #
        # The `--coverage` flag plus the "Verify the coverage report exists"
        # step above are what keep THIS repo off the #761 cause: a run that
        # reaches here has a real lcov.
        run: |
          base_args=()
          if [ -n "$BASE_COVERAGE" ]; then
            base_args=(--base-coverage "$BASE_COVERAGE")
          fi
          set +e
          node ts/bin/canary.js guardian pr-check --coverage ts/coverage/lcov.info "${base_args[@]}" --emit-analysis --post-comment
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            echo "::warning title=Guardian abstained::pr-check verified nothing (exit 3) — zero findings-eligible units, or no coverage data at all. Not a failure, and not a pass. Read the comment above for which."
            exit 0
          fi
          exit "$rc"
      # Required-check (#311, "one gate not two"): under `canary.guardian.pr.gate:
      # hard` this job exits non-zero on unaddressed critical/high findings. A repo
      # admin registers the check "PR Guardian / guardian" (workflow `name:` + job
      # id, both kept stable) as a REQUIRED status check in branch protection,
      # alongside harness/validate/enforce. Repo-admin action — full guide in
      # Phase 6.

  # Advisory diff-scoped mutation report (#486, spec D4). DELIBERATELY NOT a
  # required check: it is absent from .github/required-checks.json and must
  # stay absent until the D5 exit criterion is met (20 mutant-producing PRs at
  # <=10% false survivors). It never fails the PR on survivors.
  #
  # Today it can only ABSTAIN, and that is the honest state rather than a gap:
  # @stryker-mutator/vitest-runner 10.0.0 runs zero tests per mutant on
  # vitest 5 (stryker-js#6210), so a run under it would report every covered
  # mutant as "survived". The subcommand refuses to print that. When a fixed
  # runner is pinned, the Stryker invocation lands here and the same exit-code
  # contract carries it: 0 all-killed, 1 survivors (still advisory), 3
  # abstained.
  mutation:
    runs-on: ubuntu-latest # A4: mutation results do not vary by OS.
    timeout-minutes: 10 # D7: the wall-clock half of the budget.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Build the TypeScript engine
        run: |
          npm --prefix ts ci
          npm --prefix ts run build
      - name: Diff-scoped mutation report
        run: |
          set +e
          node ts/bin/canary.js guardian mutation \
            --repo-root . --report-out mutation-report.json
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            echo "::warning title=Mutation abstained::The mutation check verified nothing and says why in the report above. Not a failure, and not a pass."
            exit 0
          fi
          if [ "$rc" -eq 1 ]; then
            echo "::warning title=Surviving mutants::Tests covered these added lines but would not fail on them. Kill each one with an assertion, or record a reason with // canary:allow-mutant <reason>."
            exit 0
          fi
          exit "$rc"
      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ github.event.pull_request.number }}
          path: mutation-report.json
          if-no-files-found: warn
