name: Arch Timeline Snapshot

# Capture a periodic architecture-metrics snapshot into the arch trend surface
# (`.harness/arch/timeline.json`), the time-series counterpart to the committed
# `.harness/security/timeline.json` ledger (#318 C). harness gives itself this
# surface via `harness snapshot capture`; canary previously skipped it, so
# `harness snapshot trends` had no history to draw on. Runs weekly and on manual
# dispatch, and commits the appended timeline to main.

on:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC (after refresh-arch-baseline's 06:00)
  workflow_dispatch:

concurrency:
  group: arch-snapshot
  cancel-in-progress: false

# Pin the harness CLI to a major (#318 A) — see AGENTS.md "Harness dependency surface".
env:
  HARNESS_CLI: '@harness-engineering/cli@10'

permissions:
  contents: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Capture architecture snapshot
        run: npx --yes -p "$HARNESS_CLI" harness snapshot capture

      # Two stacked false greens lived here (#548). First, the guard used
      # `git diff` against a path git had never tracked — git cannot report a
      # diff for an unknown path, so the guard was trivially true, the early
      # `exit 0` always fired, and the commit below was unreachable. Seeding
      # `.harness/arch/timeline.json` on `main` fixes that, and
      # `git status --porcelain` is used regardless because it sees untracked
      # files while `git diff` does not. Second, the push targeted `main`, which
      # ruleset 16189198 rejects for every actor, and `|| echo` turned the
      # rejection into a green job. The snapshot lands as a rolling upsert PR.
      - name: Open or update the arch-timeline PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/arch-timeline
        run: |
          if [ -z "$(git status --porcelain -- .harness/arch/timeline.json)" ]; then
            echo "No new architecture snapshot to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add .harness/arch/timeline.json
          git commit -m "chore(arch): capture architecture timeline snapshot"
          git push --force origin "HEAD:$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open \
                       --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(arch): capture architecture timeline snapshot" \
              --body "Automated architecture snapshot from \`arch-snapshot.yml\`. This branch is force-updated on each weekly run; merge whenever convenient. See #548 for why this is a PR rather than a direct push."
          fi
