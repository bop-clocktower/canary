name: Refresh Arch Baseline

# Opt-in, label-gated refresh of .harness/arch/baselines.json.
#
# The arch baseline is a regression ratchet: `harness ci check` fails when a
# metric (module-size, complexity, coupling, …) grows past the recorded value,
# so a human decides whether the growth is legitimate. This workflow automates
# only the *mechanical* refresh — and only when a maintainer explicitly asks
# for it by adding the `refresh-baseline` label to a PR. Nothing refreshes
# silently; the ratchet stays intact.

on:
  pull_request:
    types: [labeled]

# Cancel a stale refresh if the PR is re-labeled while one is in flight.
concurrency:
  group: refresh-baseline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Pin the harness CLI to a major (#318 A) — see AGENTS.md "Harness dependency surface".
env:
  HARNESS_CLI: '@harness-engineering/cli@11'

jobs:
  refresh:
    # Only for our opt-in label, and only for same-repo PRs — fork PRs get a
    # read-only token and their head branch lives on the fork, so we cannot
    # push a refreshed baseline back to them.
    if: >-
      github.event.label.name == 'refresh-baseline' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: npm install -g "$HARNESS_CLI"

      # `--allow-regress --reason` is mandatory here, not optional (#634).
      # A regression is the ONLY reason anyone applies the label, and on a
      # regression `harness check-arch --update-baseline` declines to write —
      # while exiting 0 — asking to be re-run with the opt-in. Bare, this step
      # was a guaranteed no-op on its only real input. The reason is sourced
      # from the PR so it lands in `.harness/audit.log` as designed.
      - name: Refresh baseline
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          harness check-arch --update-baseline \
            --allow-regress \
            --reason "Accepted by maintainer via the refresh-baseline label on PR #${PR_NUMBER}: ${PR_TITLE}"

      - name: Commit & push the refreshed baseline
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # No change is a FAILURE, not a success (#634). The label was applied
          # because a refresh was wanted, so a run that changed nothing has not
          # done what it was asked — and with the opt-in above passed through,
          # "declined to write" is off the table, leaving either a baseline that
          # was already current (the label was unnecessary) or a CLI that
          # refused for a reason worth a human's eyes. Both need reporting; the
          # old `exit 0` reported neither.
          #
          # Detection deliberately uses `git status --porcelain`, not
          # `git diff`, and covers the whole arch directory rather than
          # baselines.json alone. On CLI 11 an accepted regression does NOT
          # rewrite baselines.json — `--allow-regress` writes a per-branch file
          # under .harness/arch/allowances/ and reports "baselines.json stays
          # byte-identical to the base", recording --reason in audit.log. So
          # the old guard watched a path the CLI intentionally leaves alone,
          # and an allowance is a NEW file, which `git diff` never reports.
          # Run 31434303396 failed here for exactly that reason while naming
          # the wrong cause.
          if [ -z "$(git status --porcelain -- .harness/arch/ .harness/audit.log)" ]; then
            echo "::error::harness check-arch --update-baseline changed nothing." \
              "Either the baseline was already current (the ratchet was not red," \
              "so the label was not needed) or the CLI declined — see the step" \
              "above. The refresh-baseline label is left in place."
            exit 1
          fi
          # Race guard: the PR branch can be deleted or merged mid-run.
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::warning::PR branch '$BRANCH' no longer exists on origin; skipping push."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage everything the guard inspects. Staging a narrower set than
          # detection covers is the same lie one step later: a green run and an
          # empty commit. audit.log carries the --reason and is tracked, so
          # dropping it would discard the record of who accepted the regression.
          git add .harness/arch/ .harness/audit.log
          git commit -m "chore(ci): refresh arch baseline via refresh-baseline label"
          git push origin "HEAD:$BRANCH"
          {
            echo "### Arch baseline refreshed"
            echo
            echo "Pushed a baseline commit to \`$BRANCH\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # Consume the label so a later regression needs a fresh, deliberate
      # opt-in rather than silently re-refreshing on the next labeled event.
      #
      # `success()`, not `always()` (#634): an opt-in is spent only by a run
      # that actually refreshed and pushed. On a failed or cancelled run the
      # label stays on the PR as visible evidence that the request is still
      # outstanding, and the operator sees a red job plus an unconsumed label
      # rather than a green job and a silently-spent opt-in. Re-running the
      # failed job retries it; the label need not be re-applied.
      - name: Remove the refresh-baseline label
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --remove-label refresh-baseline || true
