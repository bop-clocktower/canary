name: Quality & Integrity

on:
  pull_request:
  push:
    branches:
      - main

# Pin the harness CLI to a major (#318 A) — see AGENTS.md "Harness dependency surface".
env:
  HARNESS_CLI: '@harness-engineering/cli@11'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Hook customization guard
        # Fail loudly if a harness regeneration clobbered a canary-local hook
        # edit (the blocking quality gate, the formatter path-fix, or the
        # non-blocking telemetry decision). See #318 C.
        run: node scripts/check_hook_customizations.mjs

      # BLOCKING as of #718, at a floor rather than at the tool's default.
      #
      # This step was `continue-on-error: true` with the comment "allow warnings
      # for now as we transition". The transition had no end condition, no
      # target and no owner, and the measurement is 3.0% — 5 of 166 source files
      # documented. At 3% that is not a transition, it is the steady state, and
      # an open-ended soft failure is the workflow-layer version of the silent
      # abstention this repo is fixing everywhere else (#508 Wave 5, ADR 0009):
      # the step goes orange, the JOB goes green, and nobody reads the log.
      #
      # `--min-coverage 3` pins today's measurement as a FLOOR. The check now
      # blocks, so it cannot be ignored, and it blocks on regression rather than
      # on an aspiration the repo has never met — the default is 80, which this
      # repo would fail on every PR until someone runs a documentation campaign
      # nobody has scheduled. Coverage rises opportunistically and can never
      # fall back. Raise the floor when the number goes up; never lower it to
      # make CI pass. Verified against CLI 11.1.1: exit 1 at the default 80,
      # exit 0 at `--min-coverage 3`.
      - name: Harness Docs Coverage (blocking, floor at today's 3%)
        run: npx --yes -p "$HARNESS_CLI" harness check-docs --min-coverage 3

      # BLOCKING as of #544 (ADR 0012). Two bugs kept this dark: `entryPoints`
      # sat at a config path the schema never read (so the scan exited 2 at
      # startup), and once that was fixed the declared entry point was
      # `ts/bin/canary.js` — inside `bin/`, one of the analyzer's default-skipped
      # directories — so the reachability graph had no roots and all 175 scanned
      # source files came back "dead". Both are fixed in harness.config.json;
      # `ts/test/entropy-entrypoints.test.ts` keeps them fixed.
      #
      # `harness cleanup` exits 1 whenever it has findings, which is always, so
      # its exit code cannot be the gate. The ratchet reads the count from the
      # `--findings-json` contract line and compares it to the triaged baseline
      # in `.harness/entropy-baseline.json`. A MISSING count exits 3 (abstained)
      # rather than passing — that is the property that stops a future startup
      # failure from going green again.
      - name: Harness Cleanup (Entropy Scan)
        run:
          npx --yes -p "$HARNESS_CLI" harness cleanup --findings-json >
          entropy-report.txt || true

      - name: Entropy ratchet (blocking)
        run: node scripts/entropy-ratchet.mjs --report entropy-report.txt

      # WIRED as of #717. `check-perf` was referenced by no workflow at all, so
      # its 237 violations at 8c865b5 protected nothing — a check that runs
      # nowhere is not a safety net, and its passing output is not evidence.
      #
      # Same shape as the entropy ratchet above and for the same reason: 237 is
      # a real backlog, and a gate that blocks every PR on day one gets demoted
      # to advisory within a week. `check-perf` exits 1 whenever it has
      # violations, so its exit code cannot be the gate; the ratchet parses the
      # count and compares it to `.harness/perf-baseline.json`.
      #
      # NO NARROWING FLAG. `--coupling` and `--size` report `v validation
      # passed` and exit 0 over findings that are their own subject — measured
      # on the same tree in the same minute at 8c865b5, a bare run reports 237
      # and `--coupling` reports a pass over 28 coupling/import findings. They
      # do not narrow the check, they silence it into a green tick. Scoping this
      # gate to `--coupling` is the tempting move and it would be green forever
      # over nothing. `ts/test/workflow-false-green.test.ts` asserts this line
      # stays flagless, and perf-ratchet.mjs abstains on an implausible zero.
      - name: Harness Performance Check
        run:
          npx --yes -p "$HARNESS_CLI" harness check-perf > perf-report.txt 2>&1
          || true

      - name: Performance ratchet (blocking)
        run: node scripts/perf-ratchet.mjs --report perf-report.txt

      # `check-operational-drift` is deliberately NOT wired here. #717 proposed
      # wiring it blocking precisely because it was clean — no backlog to
      # grandfather, so the cheapest possible moment. That reasoning inverts
      # once you find out why it is clean.
      #
      # Probed at 533cfd7 against a 9-file, 1014-insertion diff that modified a
      # hook (`.harness/hooks/quality-warner.js`) AND added a threshold
      # (`performance.thresholds.maxComplexity`) — the two surfaces its own
      # `--help` says it flags. In `--strict` mode, against an explicit
      # `--base`, it reported "No operational-policy surfaces changed" and
      # exited 0. There is no `operationalDrift` key in harness.config.json for
      # it to read. Its clean is a ZERO DENOMINATOR, not a pass.
      #
      # Wiring it would have added a new instance of the exact #718 category
      # this change removes — a check that reports but cannot fail — while
      # looking like a win. See ADR 0014 "Declined".

      - name: Harness Phase Gate
        run: npx --yes -p "$HARNESS_CLI" harness check-phase-gate

      - name: Security Ledger Freshness
        run: |
          node scripts/security_ledger.mjs
          if ! git diff --exit-code -- \
              .harness/security/timeline.json \
              docs/SECURITY_LEDGER.md; then
            echo
            echo "::error::Security ledger is stale."
            echo "Run \`node scripts/security_ledger.mjs\` locally and commit the diff."
            exit 1
          fi

  ts-validate:
    # Pilot of the Python→TS strangler migration (docs/plans/2026-07-22-ts-
    # migration-pilot-analysis-plan.md). Independent of the Python `validate`
    # job — the two run in parallel and the Python engine is unaffected.
    name: TS engine (pilot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 22+ required: @supabase/supabase-js's realtime client needs a
          # native global WebSocket (absent in Node 20).
          node-version: '22'

      - name: Install TS pilot deps
        working-directory: ts
        run: npm ci

      - name: Typecheck (tsc strict)
        working-directory: ts
        run: npm run typecheck

      - name: Format check (prettier)
        working-directory: ts
        run: npm run format:check

      - name: Test + coverage gate (vitest)
        working-directory: ts
        run: npm test

  npm-validate:
    # The shipped `canary-test-cli` package (doctor, overlay commands, the MCP
    # bin). Its suite ran in NO CI job until #508 Wave 3: `release.yml` builds
    # the package at tag time but never tests it, so a regression here reached
    # npm unchallenged. `npm test` also runs the gate-abstention drift check
    # (`pretest`), which is what keeps npm/src/gate-result.ts identical to the
    # engine's copy -- and the npm half of the conformance registry, which
    # enforces nothing if it never executes.
    name: npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install npm package deps
        working-directory: npm
        run: npm ci

      - name: Test (node:test + gate-abstention drift check)
        working-directory: npm
        run: npm test

  skills-validate:
    # First JS skill (canary-savant) and the template test harness for skills
    # migrating off Python (canary mirrors harness, which is TS/Node). Runs in
    # parallel; the Python `validate` job is unaffected. Python + pytest are
    # installed because savant's Tier-2 integration test spawns a real pytest
    # baseline to exercise the JUnit parse.
    name: Skills (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install pytest (for the Tier-2 spawn integration test)
        run: pip install pytest

      - name: Install skills harness deps
        working-directory: agents/skills
        run: npm ci

      - name: Typecheck (tsc strict)
        working-directory: agents/skills
        run: npm run typecheck

      - name: Format check (prettier)
        working-directory: agents/skills
        run: npm run format:check

      - name: Test + coverage gate (vitest)
        working-directory: agents/skills
        run: npm test

      # Dogfood (#485), promoted to STRICT: both detectors run over canary's
      # own suites and FAIL the build on any unsuppressed finding. The backlog
      # is triaged to zero (#493/#495 fixed detector precision; #496/#498 added
      # suppression-with-reason; the genuine findings were fixed in #497 and
      # the workflow-discovery delay test). Strict is what pins the zero — an
      # advisory step whose findings nobody reads is the #413 dynamic in CI.
      # A NEW unsuppressed finding here means: fix it, or suppress it with an
      # inline reason (`blackhawk-ignore` / `savant-ignore <RULE> -- why`).
      # Never re-demote this step to advisory to make it pass.
      - name: Temporal-dependency findings (canary-blackhawk, strict)
        run:
          node agents/skills/claude-code/canary-blackhawk/scripts/cli.mjs
          ts/test agents/skills/test --strict
      - name: Order-dependence findings (canary-savant, strict)
        run:
          node agents/skills/claude-code/canary-savant/scripts/cli.mjs ts/test
          agents/skills/test --strict
