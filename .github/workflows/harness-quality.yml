name: Quality & Integrity

on:
  pull_request:
  push:
    branches:
      - main

# Pin the harness CLI to a major (#318 A) — see AGENTS.md "Harness dependency surface".
env:
  HARNESS_CLI: '@harness-engineering/cli@12'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` so the merge base is a real commit in the object DB
      # and not just a SHA in the event payload — the entropy delta gate (#703)
      # checks the base tree out as a worktree and scans it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Hook customization guard
        # Fail loudly if a harness regeneration clobbered a canary-local hook
        # edit (the blocking quality gate, the formatter path-fix, or the
        # non-blocking telemetry decision). See #318 C.
        run: node scripts/check_hook_customizations.mjs

      # BLOCKING as of #718; a merge-base RATCHET rather than a floor as of
      # #865. History below, then why the floor went.
      #
      # This step was `continue-on-error: true` with the comment "allow warnings
      # for now as we transition". The transition had no end condition, no
      # target and no owner, and the measurement is 3.0% — 5 of 166 source files
      # documented. At 3% that is not a transition, it is the steady state, and
      # an open-ended soft failure is the workflow-layer version of the silent
      # abstention this repo is fixing everywhere else (#508 Wave 5, ADR 0009):
      # the step goes orange, the JOB goes green, and nobody reads the log.
      #
      # `--min-coverage 3` pins today's measurement as a FLOOR. The check now
      # blocks, so it cannot be ignored, and it blocks on regression rather than
      # on an aspiration the repo has never met — the default is 80, which this
      # repo would fail on every PR until someone runs a documentation campaign
      # nobody has scheduled. Coverage rises opportunistically and can never
      # fall back. Raise the floor when the number goes up; never lower it to
      # make CI pass. Verified against CLI 11.1.1: exit 1 at the default 80,
      # exit 0 at `--min-coverage 3`.
      #
      # #865: the floor had ZERO slack. Main sat at 5/199 = 2.51% (printed
      # 3.0%), so #864 adding two undocumented files (2.49%) failed a PR that
      # removed nothing. A ratio taxes new files; it does not catch
      # regressions. `scripts/docs-ratchet.mjs` compares documented-file
      # IDENTITIES against the merge base instead and fails only when a file
      # documented at the base loses its link. `--min-coverage 0` keeps the
      # tool's own exit out of the decision, which belongs to the ratchet;
      # `|| true` matches the other scans, and an empty report abstains
      # (exit 3). Same two properties as the entropy and perf base scans:
      # SAME INSTRUMENT and OUTSIDE THE WORKSPACE, asserted by
      # `ts/test/docs-ratchet.test.ts`.
      - name: Harness Docs Coverage
        run:
          npx --yes -p "$HARNESS_CLI" harness check-docs --json --min-coverage 0
          > docs-report.json || true

      - name: Harness Docs Coverage (merge base)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/docs-base" "$BASE_SHA"
          (cd "$RUNNER_TEMP/docs-base" &&
            npx --yes -p "$HARNESS_CLI" harness check-docs --json --min-coverage 0) \
            > docs-base-report.json || true

      - name: Docs coverage ratchet (blocking)
        env:
          # Empty on a push to `main`: no merge base, so it reports only.
          DOCS_BASE_FLAG:
            ${{ github.event_name == 'pull_request' && '--base-report
            docs-base-report.json' || '' }}
        run:
          node scripts/docs-ratchet.mjs --report docs-report.json
          $DOCS_BASE_FLAG

      # #588: a report that dies with the runner is unreadable on the one run
      # that needs it, the failing one.
      - name: Upload docs coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-coverage-reports
          path: |
            docs-report.json
            docs-base-report.json
          if-no-files-found: ignore
          retention-days: 7

      # #744. Both ratchets below carry an ABSOLUTE count produced by this CLI,
      # and `HARNESS_CLI` is a FLOATING major (`@harness-engineering/cli@12`),
      # so the analyzer behind those counts changes with no commit to this repo.
      # It moved three times. The first two caught nobody's eye until days
      # later: 11.1.1 -> 11.2.0 took entropy 281 -> 257 (#694), and 11.2.0 ->
      # 11.3.0 took it 257 -> 147 while the ceiling stood at 267 — four days in
      # which the gate would have needed 120 net-new findings to turn red. The
      # offline guards were green throughout, because they compare the baseline
      # against itself and a floating MINOR clears a MAJOR check by
      # construction.
      #
      # The third move is the one that shows this works: 11.3.0 -> 12.1.0 took
      # entropy 147 -> 135, and it was caught BEFORE it landed — the resolved
      # version below made the ratchet abstain, and the MAJOR guard in
      # `ts/test/entropy-ratchet.test.ts` went red the moment this pin changed.
      # The floating-major hazard is unchanged in kind; what changed is that it
      # is now loud. A future @12 MINOR can still move these counts silently.
      #
      # Resolving the version here and handing it to the ratchets is what turns
      # that silent drift into a loud abstention. An unresolvable version fails
      # this step rather than passing an empty string through: a ratchet told
      # nothing about its instrument abstains anyway, but failing here names the
      # real problem instead of blaming the baseline.
      - name: Resolve harness CLI version
        id: harness-cli
        run: |
          resolved="$(npx --yes -p "$HARNESS_CLI" harness --version 2>/dev/null \
            | tail -n 1 | tr -d '[:space:]')"
          if [ -z "$resolved" ]; then
            echo "Could not resolve a version from '$HARNESS_CLI'." >&2
            exit 1
          fi
          echo "Resolved $HARNESS_CLI to $resolved"
          echo "version=$resolved" >> "$GITHUB_OUTPUT"

      # BLOCKING as of #544 (ADR 0012). Two bugs kept this dark: `entryPoints`
      # sat at a config path the schema never read (so the scan exited 2 at
      # startup), and once that was fixed the declared entry point was
      # `ts/bin/canary.js` — inside `bin/`, one of the analyzer's default-skipped
      # directories — so the reachability graph had no roots and all 175 scanned
      # source files came back "dead". Both are fixed in harness.config.json;
      # `ts/test/entropy-entrypoints.test.ts` keeps them fixed.
      #
      # `harness cleanup` exits 1 whenever it has findings, which is always, so
      # its exit code cannot be the gate. The ratchet reads the count from the
      # `--findings-json` contract line and compares it to the triaged baseline
      # in `.harness/entropy-baseline.json`. A MISSING count exits 3 (abstained)
      # rather than passing — that is the property that stops a future startup
      # failure from going green again.
      - name: Harness Cleanup (Entropy Scan)
        run:
          npx --yes -p "$HARNESS_CLI" harness cleanup --findings-json >
          entropy-report.txt || true

      # The MERGE-BASE half of the ratchet (#703). The ceiling above is an
      # absolute total, which makes headroom a shared, non-renewable budget no
      # branch can see: two branches off the same `main` each measure
      # themselves honestly, each fit, and whichever merges second fails on
      # findings it did not introduce. Observed as main 294, batch C 296, batch
      # B 297 against a 297 ceiling, C+B merged 299.
      #
      # Scanning the base tree as well makes each PR answerable for its own
      # delta, which is order-independent. Two properties this step has to
      # keep, both of which the ratchet depends on and neither of which it can
      # check for itself:
      #
      #   1. SAME INSTRUMENT. The base scan runs the same resolved
      #      `$HARNESS_CLI` in the same job as the head scan. A count is only
      #      comparable to another count from the same analyzer — this one
      #      moved 24 and then 110 findings across CLI minors with no code
      #      change at all (see $driftfix in the baseline).
      #   2. OUTSIDE THE WORKSPACE. The base worktree goes in `$RUNNER_TEMP`,
      #      never in a subdirectory of the checkout, or the head scan walks
      #      the base tree and counts every finding twice.
      #
      # `|| true` matches the head scan: `harness cleanup` exits 1 whenever it
      # has findings, which is always, so its exit code cannot gate anything.
      # An empty report is NOT silently tolerated — the ratchet abstains
      # (exit 3) on a base report with no contract line.
      - name: Harness Cleanup (Entropy Scan, merge base)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/entropy-base" "$BASE_SHA"
          cd "$RUNNER_TEMP/entropy-base"
          npx --yes -p "$HARNESS_CLI" harness cleanup --findings-json \
            > "$GITHUB_WORKSPACE/entropy-base-report.txt" || true

      - name: Entropy ratchet (blocking)
        env:
          # Empty on a push to `main`, where there is no merge base to compare
          # against and the absolute ceiling is the only rule that applies.
          BASE_FLAG:
            ${{ github.event_name == 'pull_request' && '--base-report
            entropy-base-report.txt' || '' }}
        run:
          node scripts/entropy-ratchet.mjs --report entropy-report.txt
          --cli-version "${{ steps.harness-cli.outputs.version }}" $BASE_FLAG

      # WIRED as of #717. `check-perf` was referenced by no workflow at all, so
      # its 237 violations at 8c865b5 protected nothing — a check that runs
      # nowhere is not a safety net, and its passing output is not evidence.
      #
      # Same shape as the entropy ratchet above and for the same reason: 237 is
      # a real backlog, and a gate that blocks every PR on day one gets demoted
      # to advisory within a week. `check-perf` exits 1 whenever it has
      # violations, so its exit code cannot be the gate; the ratchet parses the
      # count and compares it to `.harness/perf-baseline.json`.
      #
      # NO NARROWING FLAG. `--coupling` and `--size` report `v validation
      # passed` and exit 0 over findings that are their own subject — measured
      # on the same tree in the same minute at 8c865b5, a bare run reports 237
      # and `--coupling` reports a pass over 28 coupling/import findings. They
      # do not narrow the check, they silence it into a green tick. Scoping this
      # gate to `--coupling` is the tempting move and it would be green forever
      # over nothing. `ts/test/workflow-false-green.test.ts` asserts this line
      # stays flagless, and perf-ratchet.mjs abstains on an implausible zero.
      - name: Harness Performance Check
        run:
          npx --yes -p "$HARNESS_CLI" harness check-perf > perf-report.txt 2>&1
          || true

      # The MERGE-BASE half of the perf ratchet (#812), the same two-rule shape
      # the entropy ratchet gained in #703 and for the same reason: the ceiling
      # above is an absolute total, so headroom is a shared budget no branch
      # can see. It reached ZERO on 2026-09-09 (233 measured against 233), at
      # which point any PR adding a single function-length finding failed the
      # gate whatever its own diff did. Scanning the base tree makes each PR
      # answerable for its own delta. The two properties the entropy step
      # documents apply verbatim — SAME INSTRUMENT (`$HARNESS_CLI`, same job)
      # and OUTSIDE THE WORKSPACE (`$RUNNER_TEMP`, or the head scan walks the
      # base tree and double-counts) — and `ts/test/perf-ratchet.test.ts`
      # asserts both. `2>&1 || true` matches the head scan; an empty base
      # report is NOT silently tolerated, the ratchet abstains (exit 3) on it.
      # The two scans necessarily run under DIFFERENT absolute roots — that is
      # the point of putting the base worktree outside the checkout — so the
      # same file appears as two different paths across the two reports. The
      # ratchet compares finding IDENTITIES now (#850), so it is handed both
      # roots explicitly rather than inferring them: a wrong guess would either
      # call every finding new (false red) or fall back to counting and lose
      # the allowances (silently weaker). With no shared file at all it
      # abstains rather than reporting a number it cannot stand behind.
      - name: Harness Performance Check (merge base)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/perf-base" "$BASE_SHA"
          cd "$RUNNER_TEMP/perf-base"
          npx --yes -p "$HARNESS_CLI" harness check-perf \
            > "$GITHUB_WORKSPACE/perf-base-report.txt" 2>&1 || true

      - name: Performance ratchet (blocking)
        env:
          # Empty on a push to `main`, where there is no merge base to compare
          # against and the absolute ceiling is the only rule that applies.
          PERF_BASE_FLAG:
            ${{ github.event_name == 'pull_request' && '--base-report
            perf-base-report.txt' || '' }}
        run:
          node scripts/perf-ratchet.mjs --report perf-report.txt --cli-version
          "${{ steps.harness-cli.outputs.version }}" --report-root
          "$GITHUB_WORKSPACE" --base-report-root "$RUNNER_TEMP/perf-base"
          $PERF_BASE_FLAG

      # `check-operational-drift` is deliberately NOT wired here. #717 proposed
      # wiring it blocking precisely because it was clean — no backlog to
      # grandfather, so the cheapest possible moment. That reasoning inverts
      # once you find out why it is clean.
      #
      # Probed at 533cfd7 against a 9-file, 1014-insertion diff that modified a
      # hook (`.harness/hooks/quality-warner.js`) AND added a threshold
      # (`performance.thresholds.maxComplexity`) — the two surfaces its own
      # `--help` says it flags. In `--strict` mode, against an explicit
      # `--base`, it reported "No operational-policy surfaces changed" and
      # exited 0. There is no `operationalDrift` key in harness.config.json for
      # it to read. Its clean is a ZERO DENOMINATOR, not a pass.
      #
      # Wiring it would have added a new instance of the exact #718 category
      # this change removes — a check that reports but cannot fail — while
      # looking like a win. See ADR 0014 "Declined".

      - name: Harness Phase Gate
        run: npx --yes -p "$HARNESS_CLI" harness check-phase-gate

      - name: Security Ledger Freshness
        run: |
          node scripts/security_ledger.mjs
          if ! git diff --exit-code -- \
              .harness/security/timeline.json \
              docs/SECURITY_LEDGER.md; then
            echo
            echo "::error::Security ledger is stale."
            echo "Run \`node scripts/security_ledger.mjs\` locally and commit the diff."
            exit 1
          fi

  ts-validate:
    # Pilot of the Python→TS strangler migration (docs/plans/2026-07-22-ts-
    # migration-pilot-analysis-plan.md). Independent of the Python `validate`
    # job — the two run in parallel and the Python engine is unaffected.
    name: TS engine (pilot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 22+ required: @supabase/supabase-js's realtime client needs a
          # native global WebSocket (absent in Node 20).
          node-version-file: .nvmrc

      - name: Install TS pilot deps
        working-directory: ts
        run: npm ci

      - name: Typecheck (tsc strict)
        working-directory: ts
        run: npm run typecheck

      - name: Format check (prettier)
        working-directory: ts
        run: npm run format:check

      - name: Test + coverage gate (vitest)
        working-directory: ts
        run: npm test

  npm-validate:
    # The shipped `canary-test-cli` package (doctor, overlay commands, the MCP
    # bin). Its suite ran in NO CI job until #508 Wave 3: `release.yml` builds
    # the package at tag time but never tests it, so a regression here reached
    # npm unchallenged. `npm test` also runs the gate-abstention drift check
    # (`pretest`), which is what keeps npm/src/gate-result.ts identical to the
    # engine's copy -- and the npm half of the conformance registry, which
    # enforces nothing if it never executes.
    name: npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install npm package deps
        working-directory: npm
        run: npm ci

      - name: Test (node:test + gate-abstention drift check)
        working-directory: npm
        run: npm test

  skills-validate:
    # First JS skill (canary-savant) and the template test harness for skills
    # migrating off Python (canary mirrors harness, which is TS/Node). Runs in
    # parallel; the Python `validate` job is unaffected. Python + pytest are
    # installed because savant's Tier-2 integration test spawns a real pytest
    # baseline to exercise the JUnit parse.
    name: Skills (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install pytest (for the Tier-2 spawn integration test)
        run: pip install pytest

      # canary-cassandra's CLI delegates to the engine's vacuity-scanner rather
      # than carrying a second copy of the rules (#605: a third half-enforcer
      # is the defect, not the fix), so its tests need a built engine. They
      # assert that dependency instead of skipping when it is absent — an
      # engine-backed case that silently no-ops is a green over nothing — so
      # this job has to provide it.
      - name: Build the engine (canary-cassandra delegates to it)
        run: npm ci --prefix ts && npm run build --prefix ts

      - name: Install skills harness deps
        working-directory: agents/skills
        run: npm ci

      - name: Typecheck (tsc strict)
        working-directory: agents/skills
        run: npm run typecheck

      - name: Format check (prettier)
        working-directory: agents/skills
        run: npm run format:check

      - name: Test + coverage gate (vitest)
        working-directory: agents/skills
        run:
          npm test -- --reporter=default --reporter=json
          --outputFile=/tmp/durations.json

      # Duration ratchet (#760). The 30s testTimeout stops a contended test
      # being reported as a failure, but nothing in this suite runs over ~3.1s
      # idle, so it is also a ~10x window in which a real slowdown is
      # invisible. This is the recorded expected duration the issue asked to be
      # paired with the raise.
      #
      # It normalises against the tracked tests themselves — contention lifts
      # them all, a regression lifts one — and ABSTAINS (exit 3) rather than
      # guess when the control group is too small, the runtime differs, or the
      # run is too contended to compare. Exit 3 is deliberately NOT a failure
      # here: an abstention means it verified nothing, which is reported and
      # must not be read as a pass.
      # Uploaded so the baseline can be RE-RECORDED from a real CI run. A
      # baseline taken on a maintainer's laptop does not describe this runner:
      # the first run of this gate abstained at a load factor of 0.08 because
      # Linux spawns a process roughly an order of magnitude faster than macOS
      # and these tests are spawn-bound. Download this artifact and run the
      # ratchet with --update to refresh it.
      - name: Upload test durations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-durations-agents-skills
          path: /tmp/durations.json
          retention-days: 7

      - name: Test duration ratchet (blocking on regression)
        working-directory: agents/skills
        run: |
          set +e
          node ../../scripts/test-duration-ratchet.mjs --report /tmp/durations.json
          status=$?
          set -e
          if [ "$status" -eq 3 ]; then
            echo "::warning title=Test durations unverified::the ratchet abstained (exit 3) — this run verified NOTHING about test durations"
            exit 0
          fi
          exit "$status"

      # Dogfood (#485), promoted to STRICT: both detectors run over canary's
      # own suites and FAIL the build on any unsuppressed finding. The backlog
      # is triaged to zero (#493/#495 fixed detector precision; #496/#498 added
      # suppression-with-reason; the genuine findings were fixed in #497 and
      # the workflow-discovery delay test). Strict is what pins the zero — an
      # advisory step whose findings nobody reads is the #413 dynamic in CI.
      # A NEW unsuppressed finding here means: fix it, or suppress it with an
      # inline reason (`blackhawk-ignore` / `savant-ignore <RULE> -- why`).
      # Never re-demote this step to advisory to make it pass.
      - name: Temporal-dependency findings (canary-blackhawk, strict)
        run:
          node agents/skills/claude-code/canary-blackhawk/scripts/cli.mjs
          ts/test agents/skills/test --strict
      - name: Order-dependence findings (canary-savant, strict)
        run:
          node agents/skills/claude-code/canary-savant/scripts/cli.mjs ts/test
          agents/skills/test --strict
