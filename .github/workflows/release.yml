name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to create/upload release assets
  id-token: write # needed for npm provenance

jobs:
  # canary v6 (stage 1): the npm package now bundles and runs the TypeScript
  # engine (ts/ -> npm/dist/engine/), so there is no per-OS binary to build. The
  # retired PyInstaller path (canary.spec + the old per-OS build matrix) is no
  # longer part of the release; it stays in-tree for stage 2.
  publish:
    name: Build engine + publish (GitHub Release + npm)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: |
            ts/package-lock.json
            npm/package-lock.json

      - name: Build the TypeScript engine
        run: |
          npm --prefix ts ci
          npm --prefix ts run build

      - name: Build the npm package (stages the engine into dist/engine)
        run: |
          npm --prefix npm ci
          npm --prefix npm run build

      - name: Create GitHub Release (changelog only)
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

      - name: Publish npm package
        working-directory: npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # npm is the canonical end-user install, so a PyPI misconfig must not red-fail
    # an otherwise-successful release. Until the ONE-TIME SETUP below is completed
    # this job fails auth with `invalid-publisher`; keep it non-blocking so the
    # release still succeeds. Remove continue-on-error once the trusted publisher
    # is configured.
    continue-on-error: true
    # Builds the sdist + wheel from pyproject.toml (canary-test-ai) and uploads to
    # PyPI via Trusted Publishing (OIDC) — no long-lived API token secret required.
    #
    # ONE-TIME SETUP on PyPI (pypi.org → project "canary-test-ai" → Publishing, or a
    # "pending publisher" if the project does not exist yet): add a GitHub trusted
    # publisher with owner=bop-clocktower, repo=canary, workflow=release.yml. Until
    # that is configured this job will fail auth.
    #
    # TOKEN FALLBACK (if you prefer a token over OIDC): drop the `id-token` perm,
    # add repo secret PYPI_API_TOKEN, and give the publish step
    #   with: { password: ${{ secrets.PYPI_API_TOKEN }} }
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  advance-latest:
    name: Advance latest → ${{ github.ref_name }}
    needs: publish
    runs-on: ubuntu-latest
    # Only advance for stable vX.Y.Z tags, never pre-releases (e.g. v1.2.0-rc1).
    if: ${{ !contains(github.ref_name, '-') }}

    permissions:
      contents: write # needed to push the floating tag

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Move latest tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa latest "$RELEASE_SHA" -m "latest → ${RELEASE_TAG}"
          git push origin latest --force
          echo "Moved latest → ${RELEASE_TAG} (${RELEASE_SHA})"
