name: Wiki Sync

on:
  push:
    branches:
      - main
    paths:
      - 'docs/wiki/**'
      # Self-test: a path-filtered workflow that omits its own file is the one
      # file in the repo it cannot gate (#549).
      - '.github/workflows/wiki-sync.yml'

permissions:
  contents: write

# Two merges in quick succession would otherwise run two syncs against the same
# wiki remote at once. Queue rather than cancel, so every merge's sync stays
# visible in the run list (#1749).
concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Push docs/wiki to GitHub Wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "github-actions[bot]@users.noreply.github.com"

          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.wiki.git"

          # The wiki already exists (it has published pages since the first
          # sync), so a failed clone is an error to report, not a first run to
          # paper over. The old fallback silenced the clone and `git init`ed a
          # fresh history, which -- with the mirror below -- would try to
          # publish a history unrelated to the real wiki (#1749).
          if ! git clone "$WIKI_URL" wiki-repo; then
            echo "::error::Could not clone ${REPO}.wiki.git -- nothing was synced."
            exit 1
          fi

          # Mirror, not append: clear the published pages, then copy ours, so a
          # page deleted from docs/wiki is deleted from the wiki too (a page
          # removed in #1187 stayed live until this). Only *.md is cleared --
          # .git and any non-page asset are left alone.
          rm -f wiki-repo/*.md
          cp docs/wiki/*.md wiki-repo/

          cd wiki-repo
          git add -A
          if git diff --cached --exit-code; then
            echo "No wiki changes to push."
          else
            git commit -m "docs: sync wiki from main (${SHA})"
            git push origin HEAD:master
          fi
