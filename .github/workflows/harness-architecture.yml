# Renamed from "Architecture Enforcer" / job `enforce` by #698.
#
# The old name asserted something the job does not do. Its steps are
# `harness check-deps` and `harness validate`; neither reads
# `.harness/arch/baselines.json`, so the check named for the architecture
# ratchet never ran the architecture ratchet. That is the direct cause of the
# "gate disagrees with itself" symptom in #678 — CI reported pass here while a
# local `harness check-arch` exited 1 with 21 threshold violations. Both were
# correct; they were measuring different things, and only the name said
# otherwise. A wrong number looks anomalous; a wrong name never does.
#
# The architecture ratchet lives in the `harness` required check
# (`harness.yml` -> `harness ci check` plus the `check-arch` detail report that
# `scripts/arch-verdict.mjs` classifies). Do NOT put "architecture" back in
# this job's name unless it actually runs `check-arch` — see the rejected
# alternative in #698 (21 pre-existing threshold violations would block every
# merge).
#
# The reverse holds too (#1164): `check-deps` HERE is the layer, forbidden-import
# and cycle gate. Under harness 12.10.1 the arch ratchet's `layer-violations`,
# `forbidden-imports` and `circular-deps` metrics are 0 by construction
# (Intense-Visions/harness-engineering#2235), so `check-arch` cannot stand in
# for this job.
#
# The FILE keeps its name. `harness-architecture.yml` is referenced from
# AGENTS.md, ADR 0011, two guides, `.github/required-checks.json` and two test
# suites, and a file rename also discards the workflow's run history. The
# check context is what a reviewer reads on a PR; the filename is not.
name: Dependency & project validation

# The pull_request path filter was removed with #542: this workflow's job is
# required by ruleset 16189198, and a required check behind a path filter never
# reports on a PR outside those paths, so the PR can never merge. This also
# retires the #549 self-listing workaround for this trigger — a workflow that
# always runs cannot fail to gate its own file.
on:
  pull_request:
  push:
    branches:
      - main
  # Weekly drift sweep, Mondays 06:37 UTC. It was '0 6 * * 1' until that slot
  # stopped firing after 2026-09-07 (last run 34116676696) while the workflow
  # still reported `active`. Top-of-hour schedules are the ones GitHub drops
  # first under load, and editing this file re-registers the schedule. Keep it
  # off :00 and before arch-snapshot.yml's 07:43. `schedule-watchdog.yml`
  # turns a missed week red.
  schedule:
    - cron: '37 6 * * 1'

# Least privilege (#1236). Before this block existed, the job ran with the
# repository's default token scope. Its steps only check out the code and run
# two read-only harness commands, `check-deps` and `validate`. Nothing writes
# to the repo, the PR or the checks API, so no job needs a write scope.
permissions:
  contents: read

# Pin the harness CLI to a major (#318 A) — see AGENTS.md "Harness dependency surface".
env:
  HARNESS_CLI: '@harness-engineering/cli@12'

jobs:
  # The job id IS the check context GitHub reports (no `name:` is set), so this
  # identifier is the string in ruleset 16189198's `required_status_checks` and
  # in `.github/required-checks.json`. Changing it changes the required
  # context: the three must move together, and the ruleset edit is a manual
  # `gh api` step. See #698 and the PR that landed this rename.
  deps-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npx --yes -p "$HARNESS_CLI" harness check-deps
      - run: npx --yes -p "$HARNESS_CLI" harness validate
