name: Architecture Enforcer

# The pull_request path filter was removed with #542: `enforce` is required by
# ruleset 16189198, and a required check behind a path filter never reports on a
# PR outside those paths, so the PR can never merge. This also retires the #549
# self-listing workaround for this trigger — a workflow that always runs cannot
# fail to gate its own file.
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'

# Pin the harness CLI to a major (#318 A) — see AGENTS.md "Harness dependency surface".
env:
  HARNESS_CLI: '@harness-engineering/cli@12'

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npx --yes -p "$HARNESS_CLI" harness check-deps
      - run: npx --yes -p "$HARNESS_CLI" harness validate
