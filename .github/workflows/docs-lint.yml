name: Docs Lint

# No `paths:` filter on pull_request, deliberately (#542). These checks are
# required by ruleset 16189198, and a required check behind a path filter never
# reports on a PR outside those paths — GitHub shows it as "Expected — waiting
# for status" and the PR can never merge. Running unconditionally costs ~20s.
# `markdownlint` is the check that failed on PR #540 and was merged over.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Run markdownlint
        run:
          npx --yes markdownlint-cli "**/*.md" --ignore node_modules --ignore
          plugins --ignore agents/agents --ignore agents/commands

  fences:
    name: Code fences open and close correctly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      # markdownlint accepts a fence closed with a language tag -- it is
      # technically valid Markdown -- but it silently renders the rest of the
      # document as code. See scripts/check_doc_fences.mjs.
      - name: Check Markdown code fences
        run: node scripts/check_doc_fences.mjs

  mermaid:
    name: Wiki diagrams render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      # The GitHub Wiki renders Mermaid natively, so a malformed chart fails
      # SILENTLY -- it ships and simply shows as a code block or an error box to
      # readers. Rendering every chart here turns that into a hard failure at PR
      # time. Output goes to a temp dir and is discarded; only the exit code
      # matters.
      - name: Render every Mermaid chart in docs/wiki
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/mermaid"
          # mermaid-cli renders through headless Chromium. On Ubuntu 23.10+ the
          # runner blocks unprivileged user namespaces, so Chromium cannot build
          # its sandbox and refuses to start. Disabling the sandbox is safe here
          # and only here: the job renders the repository's OWN checked-out
          # markdown in an ephemeral container, uses no secrets, and holds no
          # write token.
          cat > "$RUNNER_TEMP/puppeteer.json" <<'PUPPETEER'
          { "args": ["--no-sandbox", "--disable-setuid-sandbox"] }
          PUPPETEER
          status=0
          found=0
          # NUL-delimited so a filename with spaces cannot split the loop. Paths
          # come from the checkout, never from event payload, so there is no
          # untrusted interpolation here.
          while IFS= read -r -d '' f; do
            grep -q '^```mermaid' "$f" || continue
            found=1
            echo "::group::$f"
            if ! npx --yes @mermaid-js/mermaid-cli@11 \
                  -p "$RUNNER_TEMP/puppeteer.json" \
                  -i "$f" -o "$RUNNER_TEMP/mermaid/$(basename "$f")"; then
              echo "::error file=$f::Mermaid chart failed to render"
              status=1
            fi
            echo "::endgroup::"
          done < <(find docs/wiki -name '*.md' -type f -print0)
          if [ "$found" -eq 0 ]; then
            echo "No Mermaid charts in docs/wiki -- nothing to validate."
          fi
          exit $status

  removed-symbols:
    name: No removed-symbol or proprietary leaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The authorship scan diffs this branch against its base, so the
          # base commit has to be present. A shallow checkout makes the gate
          # abstain (and fail) rather than silently pass on zero commits.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Check for removed-symbol drift and proprietary leaks
        # The company denylist is supplied privately via a repo secret so the
        # public workflow names no company. If the secret is unset, only the
        # generic structural checks run.
        env:
          CANARY_PROPRIETARY_DENYLIST:
            ${{ secrets.CANARY_PROPRIETARY_DENYLIST }}
          # Consumed by the authorship scan to bound the range it checks.
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          # The real PR head. Without it the scan would end its range at the
          # checked-out `refs/pull/N/merge` commit, which GitHub synthesises
          # per-event and never merges — see rangeFromEvent().
          GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check_removed_symbols.mjs
