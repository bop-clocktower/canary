name: Leak Gate

# #843, ADR 0023 (docs/knowledge/decisions/0023-leak-gate-pull-request-target.md).
#
# This job carries the REQUIRED context name
# `No removed-symbol or proprietary leaks` (its only producer since #843
# step 2b; see the note on the job), which needs
# `secrets.CANARY_PROPRIETARY_DENYLIST`. GitHub withholds secrets from
# fork-triggered `pull_request` runs, so under that trigger no fork PR could
# ever pass. `pull_request_target` runs in BASE-repo context, where the secret
# resolves, and always uses this file as it exists on the base branch, so a PR
# cannot weaken its own gate.
#
# SAFETY INVARIANT (pwn-request). Under base-repo secrets this workflow NEVER
# checks out, installs, builds or runs head code:
#   1. actions/checkout takes the base ref (the default) and never sets `ref:`.
#   2. The head commit is fetched into the object store as DATA and never
#      checked out. The scanner reads its blobs (`CANARY_LEAK_SCAN_TREE`).
#   3. The script that runs is base's scripts/check_removed_symbols.mjs.
#   4. No install, build or dependency cache.
#   5. Minimal token permissions, and no persisted credentials.
# Event values reach shell scripts only through `env:`, never as `${{ }}`
# inside `run:`. ts/test/leak-gate-workflow.test.ts enforces all of this.
#
# No `paths:` filter, deliberately (#542). A required check behind a path
# filter never reports, and the PR can never merge.
on:
  pull_request_target:
    # `edited` re-runs the gate when a PR is retargeted to another base, which
    # changes the authorship range. The default types omit it.
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

# Read-only scopes. Neither scan script calls the API, and fetching the head
# commit of this public repo needs only contents: read (#948 security review).
# pull-requests: read serves one API read: the decide step's lookup of which
# PRs contain the head commit (#1582). No write scope, ever.
permissions:
  contents: read
  pull-requests: read

# #1582. Runs for one PR queue instead of racing, so an older skip run cannot
# finish after (and paint over) a newer scan of the same head. Never cancels a
# running scan. A push is keyed by its own commit, so main's runs never queue
# behind each other (a pending run in a group is cancelled when another
# queues).
concurrency:
  group: >-
    leak-gate-${{ github.event_name == 'pull_request_target' && format('pr-{0}',
    github.event.pull_request.number) || github.sha }}
  cancel-in-progress: false

jobs:
  removed-symbols:
    # STEP 2b (#843). This job is the ONLY producer of the required context;
    # the manifest names this file, and docs-lint.yml no longer has a leak
    # job. Steps 1 and 2a (#948, #1115) staged the move because
    # pull_request_target runs the workflow as it exists on the base branch:
    # a PR that renames this job cannot report the new name on itself, so the
    # old pull_request producer had to carry the context until the rename was
    # on main. That producer could not read the secret on a fork PR, so it was
    # the job that kept every fork PR red.
    name: No removed-symbol or proprietary leaks
    runs-on: ubuntu-latest
    steps:
      # #1582. `edited` also fires on title/body edits, including edits to a
      # PR that has already merged or closed. Scanning that PR's old head
      # against today's denylist can go red with nothing left to fix. So an
      # `edited` event may skip the scan, but ONLY when the PR is not open AND
      # no open PR contains its head commit:
      # - Every `edited` event on an open PR scans, base change or not. A skip
      #   there would record a passing run for a head whose last real scan may
      #   have been red, turning the required check green without a scan.
      # - The check run attaches to the head COMMIT, and another open PR can
      #   share it, so the payload's `pull_request.state` is not enough. A
      #   re-run also replays the original payload after a reopen. The step
      #   asks the live API and skips only on a readable answer of zero open
      #   PRs. Any API error or unreadable answer scans.
      # Gated at STEP level, never with a job-level `if:`: a skipped job
      # reports "skipped", not success, and this job is the required context's
      # only producer. On a skip, checkout and setup-node still run; only the
      # head fetch and the scan are skipped, and the job finishes green.
      # ts/test/leak-gate-stale-edited.test.ts runs this script per event.
      - name: Decide whether this event needs a scan
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_STATE: ${{ github.event.pull_request.state }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          # Read by gh itself. Scoped by the read-only `permissions:` above.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          skip=false
          if [ "$EVENT_NAME" = pull_request_target ] && [ "$EVENT_ACTION" = edited ] && [ "$PR_STATE" != open ]; then
            if [ "${#HEAD_SHA}" -ne 40 ] || printf '%s' "$HEAD_SHA" | grep -q '[^0-9a-f]'; then
              echo "::notice::Head SHA is not a full 40-hex SHA; scanning."
            elif ! counts=$(gh api --paginate "repos/$REPO/commits/$HEAD_SHA/pulls" --jq '[.[] | select(.state == "open")] | length'); then
              echo "::notice::Could not list the PRs containing the head commit; scanning."
            else
              # --paginate prints one count per page. Every line must be a
              # plain non-negative integer, or the answer is unreadable.
              open_prs=0
              readable=false
              while IFS= read -r n; do
                case "$n" in
                  '') continue ;;
                  *[!0-9]*) readable=false; break ;;
                  *) readable=true; open_prs=$((open_prs + n)) ;;
                esac
              done <<< "$counts"
              if [ "$readable" != true ]; then
                echo "::notice::Unreadable answer listing the PRs containing the head commit; scanning."
              elif [ "$open_prs" -ne 0 ]; then
                echo "An open PR contains the head commit; scanning."
              else
                skip=true
                echo "::notice::Leak scan skipped: edit to a PR that is not open (state '$PR_STATE'), and no open PR contains its head commit."
              fi
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          # Base ref only (see invariant 1). Full history so that the
          # authorship scan can resolve `origin/<base>`. A shallow clone makes
          # it abstain and fail rather than pass on zero commits.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Fetch the PR head commit as data (never checked out)
        if: >-
          github.event_name == 'pull_request_target' &&
          steps.decide.outputs.skip != 'true'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$PR_HEAD_SHA" in
            *[!0-9a-f]* | '') echo "::error::PR head SHA is not hex"; exit 1 ;;
          esac
          if [ "${#PR_HEAD_SHA}" -ne 40 ]; then
            echo "::error::PR head SHA is not a full 40-hex SHA"
            exit 1
          fi
          # Fork heads are served from the base repo (refs/pull/N/head), so
          # fetching by exact SHA pins the event's commit with no ref race.
          # The fetch writes objects only. Nothing touches the working tree.
          git fetch --no-tags --no-recurse-submodules origin "$PR_HEAD_SHA"
          git cat-file -e "${PR_HEAD_SHA}^{commit}"
      - name: Check for removed-symbol drift and proprietary leaks
        if: steps.decide.outputs.skip != 'true'
        # If the secret is unset the authorship scan ABSTAINS and this step
        # fails (#784). A gate matching zero patterns has verified nothing.
        # Under pull_request_target with no readable head commit the scanner
        # also abstains rather than scanning the base checkout (#843).
        env:
          CANARY_PROPRIETARY_DENYLIST:
            ${{ secrets.CANARY_PROPRIETARY_DENYLIST }}
          # push: bounds the authorship range. Empty on PR events.
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          # PR events: the real head, which ends the authorship range.
          GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # PR events: file contents come from this commit's blobs. Empty on
          # push, where the checkout already is the commit under test.
          CANARY_LEAK_SCAN_TREE: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check_removed_symbols.mjs
