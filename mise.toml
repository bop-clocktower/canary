# Node is pinned by .nvmrc, not listed here, so one file is the single source
# of truth for the runtime (#785). mise does not read .nvmrc by default -- without
# the setting below a mise user silently gets their global Node while CI uses the
# pin, which is the exact skew #785 was filed for.
[settings]
idiomatic_version_file_enable_tools = ["node"]

[tools]
gh = "latest"
"npm:@harness-engineering/cli" = "latest"
"npm:canary-test-cli" = { version = "latest", npm_args = "--ignore-scripts=false" }

# #1239: pytest for the tests that execute a real `python3 -m pytest`. Uses the
# python3 on PATH -- the same interpreter the tests spawn -- so mise does not
# pin a Python here; CI installs from the same requirements-dev.txt.
[tasks."setup:python"]
description = "Install Python test deps (pytest) into the python3 on PATH"
run = "python3 -m pip install -r requirements-dev.txt"
